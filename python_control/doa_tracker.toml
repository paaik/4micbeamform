# reSpeaker XVF3800 direction tracker settings.
# Anything left out falls back to the defaults in doa_tracker/config.py.

[device]
# "usb"  - USB firmware, board plugged into a Pi USB port
# "i2c"  - I2S firmware, control over the Pi I2C bus (SDA GPIO2, SCL GPIO3)
# "auto" - try USB first, then I2C
transport = "auto"
usb_vid = 0x2886
usb_pid = 0x001A
i2c_bus = 1
i2c_address = 0x2C
poll_hz = 20.0

[tracking]
# "auto_beam" - azimuth of the beam the XVF3800 auto-selects for output (AEC_AZIMUTH_VALUES[3])
# "doa"       - DOA_VALUE, the whole-degree heading the LED ring shows
# "processed" - speech-weighted DoA from AUDIO_MGR_SELECTED_AZIMUTHS
source = "auto_beam"
# Only follow the source while the XVF3800 reports speech; otherwise hold the last heading.
speech_only = true

[dashboard]
enabled = true
host = "0.0.0.0"   # reachable from the LAN; use "127.0.0.1" to keep it on the Pi
port = 8765
open_browser = false

[lcd]
# Panel pins, rotation and SPI speed are in display_config/config.py.
enabled = true
refresh_hz = 8.0

[servo]
enabled = true
gpio = 13                  # header pin 33; RP1 hardware PWM0 channel 1
backend = "auto"           # "hardware" (sysfs PWM), "software" (lgpio), "auto"
min_pulse_us = 500         # pulse for servo 0 degrees; raise it if the SG90 buzzes at the end stop
max_pulse_us = 2400        # pulse for servo 180 degrees; lower it if the SG90 buzzes at the end stop
center_azimuth_deg = 0.0   # array azimuth the horn faces at servo 90 degrees
direction = 1              # -1 if the horn turns away from the sound
# Sources outside the half the SG90 can reach (center_azimuth_deg +/- 90 degrees):
# "park"   - wait facing center_azimuth_deg (servo 90) until the source comes back within reach
# "flip"   - turn so the horn's rear end points at them (full 360, but the camera then faces away)
# "clamp"  - hold the horn at the nearest end stop
# "mirror" - point at the same angle reflected to the front
out_of_range = "park"
# While the camera is locked on a drone, follow the drone's azimuth in the image instead of the sound.
camera_assist = true
# The pan-tilt camera is not at the array centre, so a sound's azimuth is not the heading
# the camera must use. It sits this far along 0°, and this far toward 270° (right, looking along 0°).
camera_forward_cm = 7.5
camera_right_cm = 5.0
# The sound is aimed as if it were this far from the array centre. Closer makes the offset
# matter more; 0 ignores it. Set it near the range you expect drones at.
sound_range_m = 10.0
deadband_deg = 3.0         # ignore heading changes smaller than this
max_speed_dps = 300.0      # slew limit, degrees per second
release_after_s = 2.0      # stop pulses after this long still (quiet, no buzz); 0 holds torque

[tilt]
# Second SG90 on the pan-tilt kit. Elevation is not limited to 0-90: negative looks down,
# positive looks up, and the whole range has to stay inside the servo's 0-180 degrees.
# It scans scan_elevations until the off-Pi detector reports a drone, then follows the drone's
# elevation, and goes back to scanning after lost_after_s without a detection.
enabled = true
gpio = 12                  # header pin 32; RP1 hardware PWM0 channel 0
backend = "auto"
# Adafruit 1967 uses an SG90/SG92. 1000-2000 us is its safe travel; 500-2400 drives the
# horn into the bracket and stalls it. 1500 us (servo 90) is the level pose it was assembled at.
min_pulse_us = 1000
max_pulse_us = 2000
level_servo_deg = 90.0     # servo angle where the camera looks level (elevation 0)
direction = -1             # on this kit, a larger servo angle tilts down into the pan body
min_elevation_deg = -90.0  # full servo travel with level_servo_deg 90 and direction -1 (servo 180)
max_elevation_deg = 90.0   # servo 0. Press Ctrl+C during the test if the plate hits the bracket
scan_elevations = [-40.0, 0.0, 45.0]
scan_dwell_s = 1.0         # pause at each scan position for sharp frames; 0 sweeps continuously
scan_speed_dps = 60.0      # tilt speed while scanning
max_speed_dps = 120.0      # tilt speed while following a drone
deadband_deg = 1.5         # ignore elevation changes smaller than this while following
min_confidence = 0.4       # detector confidence needed to lock on
lost_after_s = 2.0         # go back to scanning after this long without a detection

[camera]
# Raspberry Pi Camera v2 (IMX219), streamed as MJPEG at http://<pi>:8765/camera.mjpg
enabled = true
width = 1280
height = 960               # keep 4:3 so the picture uses the sensor's full field of view
fps = 15
jpeg_quality = 75          # lower width/height/quality if the stream stutters over Wi-Fi
hflip = true               # this camera is mounted upside down; both flips turn the picture upright
vflip = true
hfov_deg = 62.2            # IMX219 field of view, used to turn box positions into angles
vfov_deg = 48.8

[acoustic]
# USB measurement microphone: live spectrogram on the dashboard, and a drone flag when a
# propeller blade-pass frequency (BPF = RPM / 60 x blades) and its harmonics persist.
# A hovering Parrot Bebop 2 Power (3-blade props, ~7,500 RPM) sits near 375 Hz; full throttle ~600 Hz.
enabled = true
device = "auto"            # "auto" = first USB input that isn't the reSpeaker; or part of the name, or an index
sample_rate = 0            # 0 = the microphone's own rate (avoids resampling artefacts)
fft_size = 8192            # ~5.4 Hz frequency resolution at 44.1 kHz
hop_s = 0.1                # one spectrogram column every 0.1 s
display_max_hz = 4000.0    # top of the dashboard spectrogram
history_s = 30.0           # seconds of spectrogram the dashboard shows
bpf_min_hz = 100.0         # blade-pass frequencies searched
bpf_max_hz = 800.0
harmonics = 5              # BPF multiples checked (1x ... 5x)
min_harmonics = 3          # of those, how many must stand out (the 1x always must)
peak_db = 6.0              # how far a harmonic must rise above the noise around it
tolerance_pct = 3.0        # how far a harmonic may sit from an exact multiple (the four motors differ)
confirm_s = 1.5            # the same BPF must hold this long before the drone is flagged
hold_s = 2.0               # keep the flag this long after the signature fades
background_s = 60.0        # steady sounds (fans, mains hum) fade into the background over about this long; 0 = off
blades = 3                 # propeller blades, to turn BPF into motor RPM
# Show the mic level as dB SPL instead of dBFS: dB SPL = dBFS + spl_offset_db. 0 = off (dBFS).
# Omnitronic MM-2USB: about 134, since full scale is reached at its 134 dB SPL maximum. That is
# approximate (it depends on the input gain set in alsamixer or Windows), so check it against a
# reference SPL meter or a 94 dB calibrator and adjust until the readings match.
spl_offset_db = 0.0

[cloud]
# Each locked drone sample (the same rows as logs/drone_track.csv) is uploaded to Supabase.
# Run supabase_setup.sql in the Supabase SQL Editor once. Put the anon key in cloud.env:
#   SUPABASE_KEY=...
# Test with: python -m doa_tracker --cloud-test
enabled = true
url = "https://cpprovvhjlyiyjhllvzg.supabase.co"
table = "detections"
bucket = "photos"
device_id = "drone-detector-1"
auto_rows = false          # true also stores the sound azimuth once a second, labeled "sound"
sample_interval_s = 1.0
upload_interval_s = 5.0    # send queued rows in one batch this often
max_queue = 5000           # rows kept while offline; the oldest are dropped past this
